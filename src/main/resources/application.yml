server:
  port: 8761 #eureka service port

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

spring:
  application:
    name: eureka-service # application name


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
    info:
      enabled: true
    prometheus:
      access: unrestricted