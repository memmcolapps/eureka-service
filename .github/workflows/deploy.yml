name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main
      - window

jobs:
  deploy-linux:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Java Setup
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =====================
      # Build
      # =====================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        run: |
          JAR_FILE=$(find target -name "*.jar" ! -name "*original*.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "Found: $JAR_FILE"

      # =====================================================
      # SSH SETUP (STAGING)
      # =====================================================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY STAGING
      # =====================================================
      - name: Deploy Staging
        if: github.ref == 'refs/heads/staging'
        run: |
          SERVER="${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}"
          REMOTE_PATH="/opt/java-webservices/eureka-service.jar"

          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no $SERVER "mkdir -p /opt/java-webservices"

          echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Deploying (safe SSH execution)..."
          ssh -o StrictHostKeyChecking=no $SERVER 'bash -s' << 'EOF'

            set -e

            echo "Stopping app safely..."

            PID=$(ps -ef | grep eureka-service.jar | grep -v grep | awk '{print $2}')

            if [ -n "$PID" ]; then
              echo "Killing PID: $PID"
              kill -9 $PID || true
            else
              echo "No running process found"
            fi

            echo "Starting app..."

            nohup java -Dspring.profiles.active=staging \
              -jar /opt/java-webservices/eureka-service.jar &

            echo "Deployment complete"
          EOF

      # =====================================================
      # SSH SETUP (PRODUCTION)
      # =====================================================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY PRODUCTION
      # =====================================================
      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        run: |
          SERVER="${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}"
          REMOTE_PATH="/opt/java-webservices/eureka-service.jar"

          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no $SERVER "mkdir -p /opt/java-webservices"

          echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Deploying (safe SSH execution)..."
          ssh -o StrictHostKeyChecking=no $SERVER 'bash -s' << 'EOF'

            set -e

            echo "Stopping app safely..."

            PID=$(ps -ef | grep eureka-service.jar | grep -v grep | awk '{print $2}')

            if [ -n "$PID" ]; then
              echo "Killing PID: $PID"
              kill -9 $PID || true
            else
              echo "No running process found"
            fi

            echo "Starting app..."

            nohup java -Dspring.profiles.active=prod \
              -jar /opt/java-webservices/eureka-service.jar &

            echo "Deployment complete"
          EOF
          


  deploy-windows:
    if: github.ref == 'refs/heads/window'
    runs-on: ubuntu-latest

    env:
      APP_NAME: eureka-service
      DEPLOY_DIR: 'C:\java-webservices\eureka_service'

    steps:
      # ==========================
      # Checkout source
      # ==========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================
      # Setup Java
      # ==========================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ==========================
      # Build
      # ==========================
      - name: Build Application
        run: mvn clean package -DskipTests

      # ==========================
      # Find executable JAR
      # ==========================
      - name: Locate JAR
        shell: bash
        run: |
          JAR=$(find . -type f -path "*/target/*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            | head -n 1)
          
          if [ -z "$JAR" ]; then
            echo "No executable JAR found."
            exit 1
          fi
          
          echo "Using JAR: $JAR"
          cp "$JAR" app.jar
#
      # ==========================
      # Configure SSH
      # ==========================
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.WINDOW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan ${{ secrets.WINDOW_SERVER_HOST }} >> ~/.ssh/known_hosts

      # ==========================
      # Create deployment folder
      # ==========================
      - name: Create deployment directory
        run: |
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -Command \"New-Item -ItemType Directory -Force -Path 'C:\java-webservices\eureka_service'\""

      #######################################################
      # Stop service and backup current JAR
      #######################################################
      - name: Stop Service and Backup JAR
        shell: bash
        run: |
          ssh -i ~/.ssh/id_rsa \
          -o StrictHostKeyChecking=no \
          ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
          "powershell -NoProfile -ExecutionPolicy Bypass -" <<'EOF'
          
          $ErrorActionPreference = "Stop"
          
          $jar = "C:\java-webservices\eureka_service\eureka-service.jar"
          $backup = "C:\java-webservices\eureka_service\eureka-service-old.jar"
          
          Write-Host "========== STOP SERVICE =========="
          
          $service = Get-Service -Name "Eureka-Service" -ErrorAction Stop
          
          Write-Host "Current Status: $($service.Status)"
          
          if ($service.Status -eq "Running") {
           Stop-Service -Name "Eureka-Service" -Force
           $service.WaitForStatus("Stopped","00:00:30")
          }
          
          $service = Get-Service -Name "Eureka-Service"
          
          if ($service.Status -ne "Stopped") {
           throw "Failed to stop service."
          }
          
          Write-Host "Service stopped."
          
          Write-Host ""
          Write-Host "========== CHECK FOR JAVA PROCESS =========="
          
          $javaProcesses = Get-CimInstance Win32_Process |
           Where-Object {
               $_.Name -eq "java.exe" -and
               $_.CommandLine -match "eureka-service.jar"
           }
          
          if ($javaProcesses) {
          
           Write-Host "Java process still running. Killing..."
          
           foreach ($proc in $javaProcesses) {
               Write-Host "Stopping PID $($proc.ProcessId)"
               Stop-Process -Id $proc.ProcessId -Force
           }
          
           Start-Sleep -Seconds 5
          }
          
          $javaProcesses = Get-CimInstance Win32_Process |
           Where-Object {
               $_.Name -eq "java.exe" -and
               $_.CommandLine -match "eureka-service.jar"
           }
          
          if ($javaProcesses) {
           throw "Java process is still running after Stop-Process."
          }
          
          Write-Host "No Java process is locking the JAR."
          
          Write-Host ""
          Write-Host "========== BACKUP =========="
          
          if (Test-Path $backup) {
           Remove-Item $backup -Force
          }
          
          if (!(Test-Path $jar)) {
           throw "Application JAR not found."
          }
          
          Rename-Item -Path $jar -NewName "eureka-service-old.jar" -ErrorAction Stop
          
          if (!(Test-Path $backup)) {
           throw "Backup JAR was not created."
          }
          
          Write-Host "Backup completed successfully."
          
          Get-ChildItem C:\java-webservices\eureka_service
          
          EOF
