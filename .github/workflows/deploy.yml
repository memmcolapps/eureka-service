name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout source code
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Setup Java
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =====================
      # Build application
      # =====================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # =====================
      # Show build output
      # =====================
      - name: List target directory
        run: ls -lah target/

      # =====================
      # Get JAR file safely
      # =====================
      - name: Resolve JAR file
        run: |
          JAR_FILE=$(find target -name "*.jar" ! -name "*original*.jar" | head -n 1)

          echo "Found JAR: $JAR_FILE"

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No JAR found in target/"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV

      # =====================
      # DEBUG JAR BEFORE DEPLOY
      # =====================
      - name: Debug JAR
        run: |
          echo "Using JAR: $JAR_FILE"
          ls -lah "$JAR_FILE"

      # =====================================================
      # STAGING DEPLOYMENT
      # =====================================================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      - name: Deploy to Staging Server
        if: github.ref == 'refs/heads/staging'
        run: |

          echo "Preparing server..."

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }} \
            "sudo mkdir -p /opt/java-webservices && sudo chmod 777 /opt/java-webservices && pkill -f eureka-service.jar || true"

          echo "Uploading JAR..."

          scp -o StrictHostKeyChecking=no \
            "$JAR_FILE" \
            ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}:/opt/java-webservices/eureka-service.jar

          echo "Verifying upload..."

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }} \
            "ls -lah /opt/java-webservices"

          echo "Starting application..."

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }} << 'EOF'
              nohup java \
                -Dspring.profiles.active=staging \
                -jar /opt/java-webservices/eureka-service.jar \
                > /opt/java-webservices/eureka-staging.log 2>&1 &

              sleep 3

              echo "Running process:"
              ps -ef | grep eureka-service.jar | grep -v grep || true
          EOF

      # =====================================================
      # PRODUCTION DEPLOYMENT
      # =====================================================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Deploy to Production Server
        if: github.ref == 'refs/heads/main'
        run: |

          echo "Preparing server..."

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            "sudo mkdir -p /opt/java-webservices && sudo chmod 777 /opt/java-webservices && pkill -f eureka-service.jar || true"

          echo "Uploading JAR..."

          scp -o StrictHostKeyChecking=no \
            "$JAR_FILE" \
            ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:/opt/java-webservices/eureka-service.jar

          echo "Verifying upload..."

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            "ls -lah /opt/java-webservices"

          echo "Starting application..."

          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'EOF'
              nohup java \
                -Dspring.profiles.active=prod \
                -jar /opt/java-webservices/eureka-service.jar \
                > /opt/java-webservices/eureka-prod.log 2>&1 &

              sleep 3

              echo "Running process:"
              ps -ef | grep eureka-service.jar | grep -v grep || true
          EOF
