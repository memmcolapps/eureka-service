name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main
      - alfuttaim

jobs:
  deploy-linux:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Java Setup
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =====================
      # Build
      # =====================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        run: |
          JAR_FILE=$(find target -name "*.jar" ! -name "*original*.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "Found: $JAR_FILE"

      # =====================================================
      # SSH SETUP (STAGING)
      # =====================================================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY STAGING
      # =====================================================
      - name: Deploy Staging
        if: github.ref == 'refs/heads/staging'
        run: |
          set -e
          
          SERVER="${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}"
          REMOTE_DIR="/${{ secrets.LOCATION }}"
          REMOTE_PATH="$REMOTE_DIR/eureka-service.jar"
          
          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no "$SERVER" \
            "mkdir -p '$REMOTE_DIR'"
          
          echo "Stopping service..."
          ssh -o StrictHostKeyChecking=no "$SERVER" \
            "sudo systemctl stop eureka"

           echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Starting service..."
          ssh -o StrictHostKeyChecking=no "$SERVER" \
            "sudo systemctl start eureka"

          echo "Verifying service is running..."
          ssh -o StrictHostKeyChecking=no "$SERVER" \
            "sleep 5 && sudo systemctl is-active eureka"

          echo "Deployment complete"

      # =====================================================
      # SSH SETUP (PRODUCTION)
      # =====================================================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY PRODUCTION
      # =====================================================
      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        run: |
          SERVER="${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}"
          REMOTE_PATH="/${{ secrets.LOCATION }}/eureka-service.jar"

          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no $SERVER "mkdir -p /opt/java-webservices"

          echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Deploying (safe SSH execution)..."
          ssh -o StrictHostKeyChecking=no $SERVER 'bash -s' << 'EOF'

            set -e

            echo "Stopping app safely..."

            PID=$(ps -ef | grep eureka-service.jar | grep -v grep | awk '{print $2}')

            if [ -n "$PID" ]; then
              echo "Killing PID: $PID"
              kill -9 $PID || true
            else
              echo "No running process found"
            fi

            echo "Starting app..."

            nohup java -Dspring.profiles.active=prod \
              -jar /${{ secrets.LOCATION }}/eureka-service.jar \
              >/dev/null 2>&1 < /dev/null &

            echo "Deployment complete"
          EOF
          


  deploy-alfuttaim:
    if: github.ref == 'refs/heads/alfuttaim'
    runs-on: ubuntu-latest

    env:
      APP_NAME: eureka-service
      DEPLOY_DIR: 'C:\${{ secrets.WIN_LOCATION }}\eureka_service'

    steps:
      # ==========================
      # Checkout source
      # ==========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================
      # Setup Java
      # ==========================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ==========================
      # Build
      # ==========================
      - name: Build Application
        run: mvn clean package -DskipTests

      # ==========================
      # Find executable JAR
      # ==========================
      - name: Locate JAR
        shell: bash
        run: |
          JAR=$(find . -type f -path "*/target/*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            | head -n 1)
          
          if [ -z "$JAR" ]; then
            echo "No executable JAR found."
            exit 1
          fi
          
          echo "Using JAR: $JAR"
          cp "$JAR" app.jar
#
      # ==========================
      # Configure SSH
      # ==========================

      - name: Configure SSH
        shell: bash
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.WINDOW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Checking SSH private key..."
          ssh-keygen -y -f ~/.ssh/id_rsa > /tmp/github-actions.pub

          echo "Private key is valid."
          echo "Generated public key fingerprint:"
          ssh-keygen -lf /tmp/github-actions.pub

          ssh-keyscan -H "${{ secrets.WINDOW_SERVER_HOST }}" >> ~/.ssh/known_hosts
#      - name: Configure SSH
#        shell: bash
#        run: |
#          mkdir -p ~/.ssh
#
#          echo "${{ secrets.WINDOW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
#          chmod 600 ~/.ssh/id_rsa
#
#          ssh-keyscan ${{ secrets.WINDOW_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH authentication
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "whoami"

      # ==========================
      # Create deployment folder
      # ==========================
      - name: Create deployment directory
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -Command \"
              \$ErrorActionPreference='Stop'
      
              New-Item -ItemType Directory -Force -Path 'C:\${{ secrets.WIN_LOCATION }}\eureka_service' | Out-Null
      
              if (!(Test-Path 'C:\${{ secrets.WIN_LOCATION }}\eureka_service')) {
              throw 'Deployment directory was not created.'
            }
    
              Write-Host 'Deployment directory verified.'
            \""

      #######################################################
      # Verify WinSW wrapper
      #######################################################
      - name: Verify WinSW wrapper
        shell: bash
        run: |
          if [ ! -f "deployment/eureka-service.exe" ]; then
            echo "WinSW wrapper not found."
            exit 1
          fi
      
          echo "WinSW wrapper found."

      #######################################################
      # Upload WinSW wrapper
      #######################################################
      - name: Upload WinSW wrapper
        run: |
          scp -v -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            deployment/eureka-service.exe \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{ secrets.WIN_LOCATION }}/eureka_service/eureka-service.exe"

      #######################################################
      # Configure Eureka Windows Service
      #######################################################
      - name: Configure Eureka Windows Service
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
      
            $ErrorActionPreference = 'Stop'
      
            $base = "C:\${{ secrets.WIN_LOCATION }}\eureka_service"
      
            $xml = @"
            <service>
                <id>Eureka-Service</id>
                <name>Eureka-Service</name>
                <description>Eureka Service</description>
                
                <executable>java</executable>
                
                <arguments>-jar "$base\eureka-service.jar"</arguments>
                
                <workingdirectory>$base</workingdirectory>
                
                <logpath>$base\logs</logpath>
                <log mode="roll"/>
                
                <onfailure action="restart" delay="10 sec"/>
                <onfailure action="restart" delay="30 sec"/>
                <onfailure action="restart" delay="60 sec"/>
                
                <startmode>Automatic</startmode>
            </service>
            "@
      
            New-Item -ItemType Directory -Force "$base\logs" | Out-Null
        
            Set-Content `
            -Path "$base\eureka-service.xml" `
            -Value $xml `
            -Encoding UTF8
            
            Write-Host "WinSW configuration created."
            
            Get-Content "$base\eureka-service.xml"
        
          EOF

      #######################################################
      # Install or update Eureka Service
      #######################################################
      - name: Install or update Eureka Service
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
      
            $ErrorActionPreference = 'Stop'
      
            $base = "C:\${{ secrets.WIN_LOCATION }}\eureka_service"
            $wrapper = "$base\eureka-service.exe"
      
            if (!(Test-Path $wrapper)) {
                throw "WinSW wrapper not found: $wrapper"
            }
      
            Write-Host "Checking Eureka-Service..."
      
            $service = Get-Service -Name "Eureka-Service" -ErrorAction SilentlyContinue
      
            if (-not $service) {
      
                Write-Host "Eureka-Service does not exist."
                Write-Host "Installing service..."
      
                Push-Location $base
      
                & $wrapper install
      
                if ($LASTEXITCODE -ne 0) {
                    throw "Failed to install Eureka-Service."
                }
      
                Pop-Location
      
                Write-Host "Eureka-Service installed."
            }
            else {
                Write-Host "Eureka-Service already exists."
            }
      
            EOF

      #######################################################
      # Stop service and backup current JAR
      #######################################################
      - name: Stop Service and Backup JAR
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

            $ErrorActionPreference = 'Stop'

            $base = "C:\${{ secrets.WIN_LOCATION }}\eureka_service"
            $jar = "$base\eureka-service.jar"

            Write-Host "========== BEFORE =========="
            Get-ChildItem $base

            $service = Get-Service -Name "Eureka-Service" -ErrorAction SilentlyContinue

            if ($service) {

                Write-Host "Current Status: $($service.Status)"

                if ($service.Status -eq "Running") {

                    Write-Host "Stopping Eureka-Service..."

                    Stop-Service `
                        -Name "Eureka-Service" `
                        -Force `
                        -ErrorAction Stop

                    $service = Get-Service -Name "Eureka-Service"

                    $service.WaitForStatus(
                        "Stopped",
                        [TimeSpan]::FromSeconds(30)
                    )
                }
            }

            Write-Host "Service stopped."

            #
            # Make sure Java has actually exited
            #

            Write-Host "Waiting for Java process to exit..."

            $timeout = 30

            do {

                $java = Get-CimInstance Win32_Process |
                    Where-Object {
                        $_.Name -eq "java.exe" -and
                        $_.CommandLine -like "*eureka-service.jar*"
                    }

                if (-not $java) {
                    break
                }

                Write-Host "Waiting for PID(s): $($java.ProcessId -join ', ')"

                Start-Sleep -Seconds 1
                $timeout--

            } while ($timeout -gt 0)

            $java = Get-CimInstance Win32_Process |
                Where-Object {
                    $_.Name -eq "java.exe" -and
                    $_.CommandLine -like "*eureka-service.jar*"
                }

            if ($java) {
                throw "Java process still running. PID(s): $($java.ProcessId -join ', ')"
            }

            #
            # Backup existing JAR
            #

            if (Test-Path $jar) {

                $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

                $backup = "$base\eureka-service-$timestamp.jar"

                Write-Host "Backing up:"
                Write-Host "$jar"
                Write-Host "to"
                Write-Host "$backup"

                Copy-Item `
                    -Path $jar `
                    -Destination $backup `
                    -Force

                if (!(Test-Path $backup)) {
                    throw "JAR backup failed."
                }

                Write-Host "Backup completed."
            }
            else {
                Write-Host "No existing JAR found. This is the first deployment."
            }

            Write-Host "========== AFTER =========="
            Get-ChildItem $base

            EOF

      #######################################################
      # Upload new JAR
      #######################################################
      - name: Upload new JAR
        run: |
          scp -v -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            app.jar \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{ secrets.WIN_LOCATION }}/eureka_service/eureka-service.jar"

      #######################################################
      # Verify After Upload
      #######################################################
      - name: Verify after upload
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "
              Get-ChildItem C:\${{ secrets.WIN_LOCATION }}\eureka_service
            "

      #######################################################
      # Start Windows service
      #######################################################
      - name: Start Eureka Service
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'

            $ErrorActionPreference = 'Stop'

            $base = "C:\${{ secrets.WIN_LOCATION }}\eureka_service"
            $jar = "$base\eureka-service.jar"

            if (!(Test-Path $jar)) {
                throw "Deployment JAR missing: $jar"
            }

            Write-Host "Starting Eureka-Service..."

            Start-Service -Name "Eureka-Service"

            Write-Host "Waiting for service to start..."

            $service = Get-Service -Name "Eureka-Service"

            $service.WaitForStatus(
                "Running",
                [TimeSpan]::FromSeconds(30)
            )

            Start-Sleep -Seconds 5

            $service = Get-Service -Name "Eureka-Service"

            if ($service.Status -ne "Running") {
                throw "Eureka-Service failed to reach Running state."
            }

            Write-Host "Eureka-Service is RUNNING."

            #
            # Verify Java
            #

            $java = Get-CimInstance Win32_Process |
                Where-Object {
                    $_.Name -eq "java.exe" -and
                    $_.CommandLine -like "*eureka-service.jar*"
                }

            if (-not $java) {
                throw "Eureka Java process was not found."
            }

            Write-Host "Java PID(s): $($java.ProcessId -join ', ')"

            Write-Host "Deployment completed successfully."

            EOF

      #######################################################
      # Verify deployment
      #######################################################
      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} powershell -Command "
            Get-Service -Name 'Eureka-Service'

            Write-Host ''
            Write-Host 'Current files:'

            Get-ChildItem C:\${{ secrets.WIN_LOCATION }}\eureka_service\*.jar
          "


