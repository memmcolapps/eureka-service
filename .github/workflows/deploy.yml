name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main
      - alfuttaim

jobs:
  deploy-linux:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    # =====================
    # Checkout
    # =====================

      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Java Setup
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =====================
      # Build
      # =====================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR_FILE="$(find target -maxdepth 1 -type f \
            -name '*.jar' \
            ! -name '*original*.jar' \
            | head -n 1)"

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No application JAR found in target/"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> "$GITHUB_ENV"
          echo "Found application JAR: $JAR_FILE"

      # =====================
      # SSH Setup - Staging
      # =====================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================
      # SSH Setup - Production
      # =====================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================
      # Deploy to Linux
      # =====================
      - name: Deploy Eureka with systemd
        shell: bash
        env:
          SERVER_USER: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_SERVER_USER || secrets.PROD_SERVER_USER }}
          SERVER_HOST: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_SERVER_HOST || secrets.PROD_SERVER_HOST }}
          SSH_PORT: ${{ github.ref == 'refs/heads/staging' && secrets.STAGING_SSH_PORT || secrets.PROD_SSH_PORT || '22' }}
          LOCATION: ${{ secrets.LOCATION }}
          APP_PROFILE: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'prod' }}

        run: |
          set -euo pipefail

          if [[ -z "$SERVER_USER" || -z "$SERVER_HOST" || -z "$LOCATION" ]]; then
            echo "ERROR: SERVER_USER, SERVER_HOST, and LOCATION must be configured."
            exit 1
          fi

          SERVER="${SERVER_USER}@${SERVER_HOST}"
          REMOTE_DIR="/${LOCATION#/}"
          REMOTE_JAR="${REMOTE_DIR}/eureka-service.jar"
          SERVICE_NAME="eureka"
          UNIT_FILE="/etc/systemd/system/${SERVICE_NAME}.service"

          SSH_OPTS=(
            -p "$SSH_PORT"
            -o StrictHostKeyChecking=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=3
          )

          echo "========================================"
          echo "Deploying Eureka"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Server: ${SERVER}"
          echo "Directory: ${REMOTE_DIR}"
          echo "JAR: ${REMOTE_JAR}"
          echo "Profile: ${APP_PROFILE}"
          echo "========================================"

          # Create the application directory.
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "mkdir -p '$REMOTE_DIR'"

          # Ensure the systemd unit exists.
          # Existing unit files are deliberately preserved.
          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo test -f '$UNIT_FILE'" || {
              echo "No existing ${SERVICE_NAME}.service found."
              echo "Creating a default systemd unit..."

              ssh "${SSH_OPTS[@]}" "$SERVER" \
                "sudo bash -s -- '$SERVER_USER' '$REMOTE_DIR' '$APP_PROFILE'" <<'REMOTE'
          set -euo pipefail

          SERVICE_USER="$1"
          APP_DIR="$2"
          APP_PROFILE="$3"
          UNIT_FILE="/etc/systemd/system/eureka.service"

          if [ ! -f "$UNIT_FILE" ]; then
            cat > /tmp/eureka.service <<EOF
          [Unit]
          Description=Eureka Service
          After=network.target

          [Service]
          Type=simple
          User=${SERVICE_USER}
          WorkingDirectory=${APP_DIR}
          ExecStart=/usr/bin/java -Dspring.profiles.active=${APP_PROFILE} -jar ${APP_DIR}/eureka-service.jar
          Restart=on-failure
          RestartSec=10
          SuccessExitStatus=143

          [Install]
          WantedBy=multi-user.target
          EOF

            install -o root -g root -m 644 \
              /tmp/eureka.service "$UNIT_FILE"
            rm -f /tmp/eureka.service
          fi
          REMOTE
            }

          # Stop the service before replacing its JAR.
          echo "Stopping ${SERVICE_NAME} service..."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl stop '$SERVICE_NAME' || true"

          # Stop any old manually launched Java process that uses this JAR.
          # This handles the previous production nohup deployment.
          echo "Checking for legacy Eureka Java processes..."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo bash -s -- '$REMOTE_JAR'" <<'REMOTE'
          set -euo pipefail

          APP_JAR="$1"

          mapfile -t PIDS < <(
            ps -C java -o pid=,args= |
              awk -v jar="$APP_JAR" \
                'index($0, "-jar " jar) > 0 { print $1 }'
          )

          if [ "${#PIDS[@]}" -eq 0 ]; then
            echo "No legacy Java process found."
            exit 0
          fi

          for PID in "${PIDS[@]}"; do
            STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

            if [ -n "$STATE" ] && [[ "$STATE" != Z* ]]; then
              echo "Sending TERM to legacy process $PID..."
              kill -TERM "$PID" 2>/dev/null || true
            fi
          done

          for attempt in $(seq 1 15); do
            REMAINING=0

            for PID in "${PIDS[@]}"; do
              STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

              if [ -n "$STATE" ] && [[ "$STATE" != Z* ]]; then
                REMAINING=1
              fi
            done

            [ "$REMAINING" -eq 0 ] && break
            sleep 1
          done

          for PID in "${PIDS[@]}"; do
            STATE="$(ps -o stat= -p "$PID" 2>/dev/null | awk '{print $1}')"

            if [ -n "$STATE" ] && [[ "$STATE" != Z* ]]; then
              echo "Process $PID did not stop; sending KILL..."
              kill -KILL "$PID" 2>/dev/null || true
            fi
          done
          REMOTE

          # Upload only the application JAR.
          echo "Uploading application JAR..."

          rsync -az \
            -e "ssh -p ${SSH_PORT} -o StrictHostKeyChecking=no -o ServerAliveInterval=30" \
            "$JAR_FILE" \
            "${SERVER}:${REMOTE_JAR}"

          # Ensure the existing unit is reloaded and enabled.
          echo "Reloading systemd..."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl daemon-reload &&
             sudo systemctl enable '$SERVICE_NAME'"

          # Start the application under systemd.
          echo "Starting Eureka..."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl start '$SERVICE_NAME'"

          # Wait for systemd to report the service as active.
          echo "Verifying service startup..."

          ACTIVE=false

          for attempt in $(seq 1 30); do
            if ssh "${SSH_OPTS[@]}" "$SERVER" \
              "sudo systemctl is-active --quiet '$SERVICE_NAME'"; then
              ACTIVE=true
              break
            fi

            sleep 2
          done

          if [ "$ACTIVE" != "true" ]; then
            echo "ERROR: Eureka failed to become active."
            ssh "${SSH_OPTS[@]}" "$SERVER" \
              "sudo systemctl status '$SERVICE_NAME' --no-pager -l || true;
               sudo journalctl -u '$SERVICE_NAME' -n 100 --no-pager || true"
            exit 1
          fi

          echo "Deployment successful."

          ssh "${SSH_OPTS[@]}" "$SERVER" \
            "sudo systemctl status '$SERVICE_NAME' --no-pager -l"
  deploy-alfuttaim:
    if: github.ref == 'refs/heads/alfuttaim'
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # Setup Java
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # ============================================================
      # Build Application
      # ============================================================
      - name: Build Application
        run: mvn clean package -DskipTests


      # ============================================================
      # Locate JAR
      # ============================================================
      - name: Locate JAR
        shell: bash
        run: |
          JAR=$(find . -type f -path "*/target/*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            | head -n 1)
  
          if [ -z "$JAR" ]; then
            echo "ERROR: No executable JAR found."
            exit 1
          fi
  
          echo "Using JAR: $JAR"
  
          cp "$JAR" app.jar
  
          ls -lh app.jar
  

      # ============================================================
      # Configure SSH
      # ============================================================
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
  
          echo "${{ secrets.WINDOW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
  
          chmod 600 ~/.ssh/id_rsa
  
          ssh-keyscan -H \
            "${{ secrets.WINDOW_SERVER_HOST }}" \
            >> ~/.ssh/known_hosts
  
          echo "SSH configured."
  

      # ============================================================
      # Test SSH
      # ============================================================
      - name: Test SSH Authentication
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "whoami"
  

      # ============================================================
      # Verify WinSW exists in repository
      # ============================================================
      - name: Verify WinSW Wrapper
        shell: bash
        run: |
          if [ ! -f "deployment/eureka-service.exe" ]; then
            echo "ERROR: deployment/eureka-service.exe not found."
            exit 1
          fi
  
          echo "WinSW wrapper found."
  

      # ============================================================
      # Create WinSW XML locally
      # ============================================================
      - name: Create WinSW Configuration
        shell: bash
        run: |
          cat > deployment/eureka-service.xml <<EOF
          <service>
              <id>Eureka-Service</id>
              <name>Eureka-Service</name>
              <description>Travana Eureka Service</description>
  
              <executable>java</executable>
  
              <arguments>-jar "C:\${{ secrets.WIN_LOCATION }}\eureka_service\eureka-service.jar"</arguments>
  
              <workingdirectory>C:\${{ secrets.WIN_LOCATION }}\eureka_service</workingdirectory>
  
              <logpath>C:\${{ secrets.WIN_LOCATION }}\eureka_service\logs</logpath>
  
              <log mode="roll"/>
  
              <onfailure action="restart" delay="10 sec"/>
              <onfailure action="restart" delay="30 sec"/>
              <onfailure action="restart" delay="60 sec"/>
  
              <startmode>Automatic</startmode>
          </service>
          EOF
  
          echo "WinSW configuration created."
  

      # ============================================================
      # Upload deployment files
      #
      # We upload these into a temporary folder first.
      # The Windows deployment script decides whether they are needed.
      # ============================================================
      - name: Create Remote Temporary Directory
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "powershell -NoProfile -NonInteractive -Command \"New-Item -ItemType Directory -Force -Path 'C:\travana-deploy-temp' | Out-Null\""
  

      - name: Upload Deployment Files
        shell: bash
        run: |
          scp \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            deployment/eureka-service.exe \
            deployment/eureka-service.xml \
            app.jar \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/travana-deploy-temp/"
  

      # ============================================================
      # Create Windows deployment script
      # ============================================================
      - name: Create Windows Deployment Script
        shell: bash
        run: |
          cat > deployment/deploy-eureka.ps1 <<'POWERSHELL'
  
          $ErrorActionPreference = "Stop"
  
          # ========================================================
          # Configuration
          # ========================================================
  
          $base = "C:\${{ secrets.WIN_LOCATION }}\eureka_service"
  
          $temp = "C:\travana-deploy-temp"
  
          $wrapper = Join-Path $base "eureka-service.exe"
  
          $config = Join-Path $base "eureka-service.xml"
  
          $jar = Join-Path $base "eureka-service.jar"
  
          $logs = Join-Path $base "logs"
  
          $serviceName = "Eureka-Service"
  
  
          Write-Host ""
          Write-Host "============================================"
          Write-Host "Travana Eureka Deployment"
          Write-Host "============================================"
  
          Write-Host ""
          Write-Host "Deployment directory:"
          Write-Host $base
  
  
          # ========================================================
          # Create deployment directory if missing
          # ========================================================
  
          if (!(Test-Path -LiteralPath $base -PathType Container)) {
  
              Write-Host ""
              Write-Host "Deployment directory does not exist."
              Write-Host "Creating..."
  
              New-Item `
                  -ItemType Directory `
                  -Path $base `
                  -Force | Out-Null
  
          }
          else {
  
              Write-Host ""
              Write-Host "Deployment directory already exists."
              Write-Host "Nothing to create."
  
          }
  
  
          # ========================================================
          # Create logs directory if missing
          # ========================================================
  
          if (!(Test-Path -LiteralPath $logs -PathType Container)) {
  
              Write-Host ""
              Write-Host "Logs directory does not exist."
              Write-Host "Creating..."
  
              New-Item `
                  -ItemType Directory `
                  -Path $logs `
                  -Force | Out-Null
  
          }
          else {
  
              Write-Host ""
              Write-Host "Logs directory already exists."
              Write-Host "Nothing to create."
  
          }
  
  
          # ========================================================
          # WinSW wrapper
          # ========================================================
  
          if (!(Test-Path -LiteralPath $wrapper -PathType Leaf)) {
  
              Write-Host ""
              Write-Host "WinSW wrapper does not exist."
              Write-Host "Installing wrapper..."
  
              Copy-Item `
                  -LiteralPath (Join-Path $temp "eureka-service.exe") `
                  -Destination $wrapper `
                  -Force
  
          }
          else {
  
              Write-Host ""
              Write-Host "WinSW wrapper already exists."
              Write-Host "Skipping wrapper upload."
  
          }
  
  
          # ========================================================
          # WinSW configuration
          # ========================================================
  
          if (!(Test-Path -LiteralPath $config -PathType Leaf)) {
  
              Write-Host ""
              Write-Host "WinSW configuration does not exist."
              Write-Host "Installing configuration..."
  
              Copy-Item `
                  -LiteralPath (Join-Path $temp "eureka-service.xml") `
                  -Destination $config `
                  -Force
  
          }
          else {
  
              Write-Host ""
              Write-Host "WinSW configuration already exists."
              Write-Host "Skipping configuration upload."
  
          }
  
  
          # ========================================================
          # Verify WinSW files
          # ========================================================
  
          if (!(Test-Path -LiteralPath $wrapper -PathType Leaf)) {
  
              throw "WinSW wrapper does not exist: $wrapper"
  
          }
  
  
          if (!(Test-Path -LiteralPath $config -PathType Leaf)) {
  
              throw "WinSW configuration does not exist: $config"
  
          }
  
  
          # ========================================================
          # Check existing service
          # ========================================================
  
          $service = Get-Service `
              -Name $serviceName `
              -ErrorAction SilentlyContinue
  
  
          if ($service) {
  
              Write-Host ""
              Write-Host "Eureka-Service already exists."
  
              Write-Host "Current status:"
              Write-Host $service.Status
  
  
              # ====================================================
              # Stop service if running
              # ====================================================
  
              if ($service.Status -eq "Running") {
  
                  Write-Host ""
                  Write-Host "Stopping Eureka-Service..."
  
                  Stop-Service `
                      -Name $serviceName `
                      -Force
  
                  $timeout = 30
  
                  while ($timeout -gt 0) {
  
                      $service = Get-Service `
                          -Name $serviceName
  
                      if ($service.Status -eq "Stopped") {
  
                          break
  
                      }
  
                      Start-Sleep -Seconds 1
  
                      $timeout--
  
                  }
  
  
                  $service = Get-Service `
                      -Name $serviceName
  
  
                  if ($service.Status -ne "Stopped") {
  
                      throw "Eureka-Service could not be stopped."
  
                  }
  
                  Write-Host "Eureka-Service stopped."
  
              }
  
          }
          else {
  
              Write-Host ""
              Write-Host "Eureka-Service is not installed."
  
          }
  
  
          # ========================================================
          # Backup existing JAR
          # ========================================================
  
          if (Test-Path -LiteralPath $jar -PathType Leaf) {
  
              $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
  
              $backup = Join-Path `
                  $base `
                  "eureka-service-$timestamp.jar"
  
  
              Write-Host ""
              Write-Host "Backing up existing JAR..."
  
              Copy-Item `
                  -LiteralPath $jar `
                  -Destination $backup `
                  -Force
  
  
              Write-Host "Backup created:"
              Write-Host $backup
  
          }
          else {
  
              Write-Host ""
              Write-Host "No existing JAR."
              Write-Host "This is the first deployment."
  
          }
  
  
          # ========================================================
          # Upload new JAR
          # ========================================================
  
          Write-Host ""
          Write-Host "Installing new JAR..."
  
          Copy-Item `
              -LiteralPath (Join-Path $temp "app.jar") `
              -Destination $jar `
              -Force
  
  
          if (!(Test-Path -LiteralPath $jar -PathType Leaf)) {
  
              throw "New JAR was not copied successfully."
  
          }
  
  
          Write-Host "New JAR installed."
  
  
          # ========================================================
          # Install service if missing
          # ========================================================
  
          $service = Get-Service `
              -Name $serviceName `
              -ErrorAction SilentlyContinue
  
  
          if (!$service) {
  
              Write-Host ""
              Write-Host "Installing Eureka-Service..."
  
              Push-Location $base
  
              try {
  
                  & $wrapper install
  
                  if ($LASTEXITCODE -ne 0) {
  
                      throw "WinSW service installation failed."
  
                  }
  
              }
              finally {
  
                  Pop-Location
  
              }
  
  
              Write-Host "Eureka-Service installed."
  
          }
          else {
  
              Write-Host ""
              Write-Host "Eureka-Service already installed."
              Write-Host "Skipping installation."
  
          }
  
  
          # ========================================================
          # Start service
          # ========================================================
  
          $service = Get-Service `
              -Name $serviceName
  
  
          if ($service.Status -ne "Running") {
  
              Write-Host ""
              Write-Host "Starting Eureka-Service..."
  
              Start-Service `
                  -Name $serviceName
  
  
              $timeout = 30
  
              while ($timeout -gt 0) {
  
                  $service = Get-Service `
                      -Name $serviceName
  
                  if ($service.Status -eq "Running") {
  
                      break
  
                  }
  
                  Start-Sleep -Seconds 1
  
                  $timeout--
  
              }
  
          }
  
  
          # ========================================================
          # Final service verification
          # ========================================================
  
          $service = Get-Service `
              -Name $serviceName
  
  
          Write-Host ""
          Write-Host "============================================"
          Write-Host "Service Status"
          Write-Host "============================================"
  
          Write-Host $service.Status
  
  
          if ($service.Status -ne "Running") {
  
              throw "Eureka-Service is not running."
  
          }
  
  
          # ========================================================
          # Final files
          # ========================================================
  
          Write-Host ""
          Write-Host "============================================"
          Write-Host "Deployment Files"
          Write-Host "============================================"
  
          Get-ChildItem `
              -LiteralPath $base |
              Select-Object Name, Length, LastWriteTime
  
  
          # ========================================================
          # Verify Java process
          # ========================================================
  
          Write-Host ""
          Write-Host "============================================"
          Write-Host "Eureka Java Process"
          Write-Host "============================================"
  
          $java = Get-CimInstance Win32_Process |
              Where-Object {
                  $_.Name -eq "java.exe" -and
                  $_.CommandLine -like "*eureka-service.jar*"
              }
  
  
          if ($java) {
  
              $java |
                  Select-Object ProcessId, CommandLine |
                  Format-List
  
          }
          else {
  
              Write-Warning "Eureka Java process was not found."
  
          }
  
  
          # ========================================================
          # Cleanup temporary deployment files
          # ========================================================
  
          Write-Host ""
          Write-Host "Cleaning temporary deployment files..."
  
          Remove-Item `
              -LiteralPath $temp `
              -Recurse `
              -Force
  
  
          Write-Host ""
          Write-Host "============================================"
          Write-Host "Deployment completed successfully."
          Write-Host "============================================"
  
          POWERSHELL
  

      # ============================================================
      # Upload Windows deployment script
      # ============================================================
      - name: Upload Windows Deployment Script
        shell: bash
        run: |
          scp \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            deployment/deploy-eureka.ps1 \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/travana-deploy-temp/deploy-eureka.ps1"
  

      # ============================================================
      # Execute Windows Deployment Script
      # ============================================================
      - name: Deploy Eureka Service
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File C:\travana-deploy-temp\deploy-eureka.ps1"



