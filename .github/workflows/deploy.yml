name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Java Setup (with Maven cache)
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =====================
      # Build (FAST)
      # =====================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # =====================
      # Find JAR
      # =====================
      - name: Resolve JAR
        run: |
          JAR_FILE=$(find target -name "*.jar" ! -name "*original*.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "Found: $JAR_FILE"

      # =====================
      # SSH Setup (Staging)
      # =====================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================
      # Deploy Staging
      # =====================
      - name: Deploy Staging
        if: github.ref == 'refs/heads/staging'
        run: |
          SERVER="${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}"
          REMOTE_PATH="/opt/java-webservices/eureka-service.jar"
          
          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no $SERVER "mkdir -p /opt/java-webservices"
          
          echo "Stopping app..."
          ssh -o StrictHostKeyChecking=no $SERVER "
            PID=\$(pgrep -f eureka-service.jar || true)
            if [ ! -z \"\$PID\" ]; then
              kill -9 \$PID || true
            fi
          "
          
          echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH
          
          echo "Starting app..."
          ssh -o StrictHostKeyChecking=no $SERVER "
            nohup java -Dspring.profiles.active=staging \
            -jar $REMOTE_PATH \
            > /opt/java-webservices/eureka-staging.log 2>&1 &
          
            sleep 3
            pgrep -f eureka-service.jar || true
          "

      # =====================
      # SSH Setup (Production)
      # =====================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================
      # Deploy Production
      # =====================
      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        run: |
          SERVER="${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}"
          REMOTE_PATH="/opt/java-webservices/eureka-service.jar"

          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no $SERVER "mkdir -p /opt/java-webservices"

          echo "Stopping app..."
          ssh -o StrictHostKeyChecking=no $SERVER "
            PID=\$(pgrep -f eureka-service.jar || true)
            if [ ! -z \"\$PID\" ]; then
              kill -9 \$PID || true
            fi
          "

          echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Starting app..."
          ssh -o StrictHostKeyChecking=no $SERVER "
            nohup java -Dspring.profiles.active=prod \
            -jar $REMOTE_PATH \
            > /opt/java-webservices/eureka-prod.log 2>&1 &

            sleep 3
            pgrep -f eureka-service.jar || true
          "


