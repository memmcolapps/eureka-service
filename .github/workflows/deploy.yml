name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main
      - window

jobs:
  deploy-linux:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Java Setup
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =====================
      # Build
      # =====================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        run: |
          JAR_FILE=$(find target -name "*.jar" ! -name "*original*.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "Found: $JAR_FILE"

      # =====================================================
      # SSH SETUP (STAGING)
      # =====================================================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY STAGING
      # =====================================================
      - name: Deploy Staging
        if: github.ref == 'refs/heads/staging'
        run: |
          SERVER="${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}"
          REMOTE_PATH="/opt/java-webservices/eureka-service.jar"

          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no $SERVER "mkdir -p /opt/java-webservices"

          echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Deploying (safe SSH execution)..."
          ssh -o StrictHostKeyChecking=no $SERVER 'bash -s' << 'EOF'

            set -e

            echo "Stopping app safely..."

            PID=$(ps -ef | grep eureka-service.jar | grep -v grep | awk '{print $2}')

            if [ -n "$PID" ]; then
              echo "Killing PID: $PID"
              kill -9 $PID || true
            else
              echo "No running process found"
            fi

            echo "Starting app..."

            nohup java -Dspring.profiles.active=staging \
              -jar /opt/java-webservices/eureka-service.jar &

            echo "Deployment complete"
          EOF

      # =====================================================
      # SSH SETUP (PRODUCTION)
      # =====================================================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY PRODUCTION
      # =====================================================
      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        run: |
          SERVER="${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}"
          REMOTE_PATH="/opt/java-webservices/eureka-service.jar"

          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no $SERVER "mkdir -p /opt/java-webservices"

          echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Deploying (safe SSH execution)..."
          ssh -o StrictHostKeyChecking=no $SERVER 'bash -s' << 'EOF'

            set -e

            echo "Stopping app safely..."

            PID=$(ps -ef | grep eureka-service.jar | grep -v grep | awk '{print $2}')

            if [ -n "$PID" ]; then
              echo "Killing PID: $PID"
              kill -9 $PID || true
            else
              echo "No running process found"
            fi

            echo "Starting app..."

            nohup java -Dspring.profiles.active=prod \
              -jar /opt/java-webservices/eureka-service.jar &

            echo "Deployment complete"
          EOF
          
  deploy-window:
    if: github.ref == 'refs/heads/window'
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Java Setup
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =====================
      # Build
      # =====================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        run: |
          JAR_FILE=$(find target -name "*.jar" ! -name "*original*.jar" | head -n 1)
  
          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found"
            exit 1
          fi
  
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "Found: $JAR_FILE"

      # =====================
      # SSH Setup
      # =====================
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.WINDOW_SSH_PRIVATE_KEY }}

      # =====================
      # Deploy
      # =====================
      - name: Deploy to Windows
        run: |
          SERVER="${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}"
          
          echo "Creating deployment directory..."
          
          ssh -o StrictHostKeyChecking=no $SERVER \
            'powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path C:\java-webservices | Out-Null"'
          
          echo "Creating deployment script..."
          
          cat > deploy.ps1 <<'EOF'
          $ErrorActionPreference = "Stop"
          
          $jarPath = "C:\java-webservices\eureka-service.jar"
          $workingDir = "C:\java-webservices"
          
          $logFile = "$workingDir\eureka.log"
          $errorFile = "$workingDir\eureka-error.log"
          
          $appPort = 8761
          
          Write-Host "Stopping existing Eureka..."
          
          Get-CimInstance Win32_Process |
          Where-Object {
              $_.Name -match "^java(.exe)?$" -and
              $_.CommandLine -like "*eureka-service.jar*"
          } |
          ForEach-Object {
              Stop-Process -Id $_.ProcessId -Force
          }
          
          Start-Sleep -Seconds 3
          
          if (!(Test-Path $jarPath)) {
              throw "JAR not found: $jarPath"
          }
          
          $java = (Get-Command java).Source
          
          Write-Host ""
          Write-Host "Java executable:"
          Write-Host $java
          
          & $java -version
          
          Remove-Item $logFile -ErrorAction Ignore
          Remove-Item $errorFile -ErrorAction Ignore
          
          Write-Host ""
          Write-Host "Starting application..."
          
          $proc = Start-Process `
              -FilePath $java `
              -WorkingDirectory $workingDir `
              -ArgumentList @(
                  "-Dspring.profiles.active=prod",
                  "-jar",
                  $jarPath
              ) `
              -RedirectStandardOutput $logFile `
              -RedirectStandardError $errorFile `
              -PassThru
          
          Write-Host "PID: $($proc.Id)"
          
          Start-Sleep -Seconds 20
          
          $proc.Refresh()
          
          if ($proc.HasExited) {
          
              Write-Host ""
              Write-Host "Application exited."
              Write-Host "Exit Code: $($proc.ExitCode)"
          
              if (Test-Path $logFile) {
                  Write-Host ""
                  Write-Host "===== STDOUT ====="
                  Get-Content $logFile -Tail 100
              }
          
              if (Test-Path $errorFile) {
                  Write-Host ""
                  Write-Host "===== STDERR ====="
                  Get-Content $errorFile -Tail 100
              }
          
              exit 1
          }
          
          Write-Host ""
          Write-Host "Checking application port..."
          
          $listener = Get-NetTCPConnection `
              -State Listen `
              -LocalPort $appPort `
              -ErrorAction SilentlyContinue
          
          if ($null -eq $listener) {
          
              Write-Host ""
              Write-Host "Application is running but port $appPort is not listening."
          
              if (Test-Path $logFile) {
                  Write-Host ""
                  Get-Content $logFile -Tail 100
              }
          
              if (Test-Path $errorFile) {
                  Write-Host ""
                  Get-Content $errorFile -Tail 100
              }
          
              exit 1
          }
          
          Write-Host ""
          Write-Host "===================================="
          Write-Host "Application started successfully"
          Write-Host "PID : $($proc.Id)"
          Write-Host "Port: $appPort"
          Write-Host "===================================="
          EOF
          
          echo "Uploading JAR..."
          
          scp -o StrictHostKeyChecking=no \
            "$JAR_FILE" \
            "$SERVER:C:/java-webservices/eureka-service.jar"
          
          echo "Uploading deployment script..."
          
          scp -o StrictHostKeyChecking=no \
            deploy.ps1 \
            "$SERVER:C:/java-webservices/deploy.ps1"
          
          echo "Executing deployment..."
          
          ssh -tt -o StrictHostKeyChecking=no $SERVER \
            'powershell -NoProfile -ExecutionPolicy Bypass -File C:\java-webservices\deploy.ps1'

          echo "Deployment completed."


