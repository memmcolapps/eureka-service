name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main
      - alfuttaim

jobs:
  deploy-linux:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Java Setup
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =====================
      # Build
      # =====================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        run: |
          JAR_FILE=$(find target -name "*.jar" ! -name "*original*.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "Found: $JAR_FILE"

      # =====================================================
      # SSH SETUP (STAGING)
      # =====================================================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY STAGING
      # =====================================================
      - name: Deploy Staging
        if: github.ref == 'refs/heads/staging'
        run: |
          set -e
          
          SERVER="${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}"
          REMOTE_DIR="/${{ secrets.LOCATION }}"
          REMOTE_PATH="$REMOTE_DIR/eureka-service.jar"
          
          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no "$SERVER" \
            "mkdir -p '$REMOTE_DIR'"
          
          echo "Stopping service..."
          ssh -o StrictHostKeyChecking=no "$SERVER" \
            "sudo systemctl stop eureka"

           echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Starting service..."
          ssh -o StrictHostKeyChecking=no "$SERVER" \
            "sudo systemctl start eureka"

          echo "Verifying service is running..."
          ssh -o StrictHostKeyChecking=no "$SERVER" \
            "sleep 5 && sudo systemctl is-active eureka"

          echo "Deployment complete"

      # =====================================================
      # SSH SETUP (PRODUCTION)
      # =====================================================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY PRODUCTION
      # =====================================================
      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        run: |
          SERVER="${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}"
          REMOTE_PATH="/${{ secrets.LOCATION }}/eureka-service.jar"

          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no $SERVER "mkdir -p /opt/java-webservices"

          echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Deploying (safe SSH execution)..."
          ssh -o StrictHostKeyChecking=no $SERVER 'bash -s' << 'EOF'

            set -e

            echo "Stopping app safely..."

            PID=$(ps -ef | grep eureka-service.jar | grep -v grep | awk '{print $2}')

            if [ -n "$PID" ]; then
              echo "Killing PID: $PID"
              kill -9 $PID || true
            else
              echo "No running process found"
            fi

            echo "Starting app..."

            nohup java -Dspring.profiles.active=prod \
              -jar /${{ secrets.LOCATION }}/eureka-service.jar \
              >/dev/null 2>&1 < /dev/null &

            echo "Deployment complete"
          EOF
          


  deploy-alfuttaim:
    if: github.ref == 'refs/heads/alfuttaim'
    runs-on: ubuntu-latest

    env:
      APP_NAME: eureka-service
      DEPLOY_DIR: 'C:\${{ secrets.WIN_LOCATION }}\eureka_service'

    steps:
      # ==========================
      # Checkout source
      # ==========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================
      # Setup Java
      # ==========================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ==========================
      # Build
      # ==========================
      - name: Build Application
        run: mvn clean package -DskipTests

      # ==========================
      # Find executable JAR
      # ==========================
      - name: Locate JAR
        shell: bash
        run: |
          JAR=$(find . -type f -path "*/target/*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            | head -n 1)
          
          if [ -z "$JAR" ]; then
            echo "No executable JAR found."
            exit 1
          fi
          
          echo "Using JAR: $JAR"
          cp "$JAR" app.jar
#
      # ==========================
      # Configure SSH
      # ==========================
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.WINDOW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan ${{ secrets.WINDOW_SERVER_HOST }} >> ~/.ssh/known_hosts
          
            # ==========================
      # Test SSH
      # ==========================
      - name: Test SSH Authentication
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "whoami"

      # ==========================
      # Create deployment directory
      # ==========================
      - name: Create deployment directory
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "powershell -NoProfile -NonInteractive -Command \"New-Item -ItemType Directory -Force -Path 'C:\${{ secrets.WIN_LOCATION }}\eureka_service' | Out-Null; if (!(Test-Path 'C:\${{ secrets.WIN_LOCATION }}\eureka_service')) { throw 'Deployment directory was not created.' }; Write-Host 'Deployment directory verified.'\""

      # ==========================
      # Verify WinSW wrapper exists
      # ==========================
      - name: Verify WinSW wrapper
        shell: bash
        run: |
          if [ ! -f "deployment/eureka-service.exe" ]; then
            echo "WinSW wrapper not found."
            exit 1
          fi

          echo "WinSW wrapper found."

      # ==========================
      # Upload WinSW wrapper
      # ==========================
      - name: Upload WinSW wrapper
        shell: bash
        run: |
          scp \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            deployment/eureka-service.exe \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{ secrets.WIN_LOCATION }}/eureka_service/eureka-service.exe"

      # ==========================
      # Create WinSW configuration
      # ==========================
      - name: Create WinSW configuration
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "powershell -NoProfile -NonInteractive -Command \"\$base='C:\${{ secrets.WIN_LOCATION }}\eureka_service'; New-Item -ItemType Directory -Force -Path '\$base\logs' | Out-Null; \$xml=@'
            <service>
                <id>Eureka-Service</id>
                <name>Eureka-Service</name>
                <description>Eureka Service</description>
              
                <executable>java</executable>
                <arguments>-jar &quot;C:\${{ secrets.WIN_LOCATION }}\eureka_service\eureka-service.jar&quot;</arguments>
              
                <workingdirectory>C:\${{ secrets.WIN_LOCATION }}\eureka_service</workingdirectory>
              
                <logpath>C:\${{ secrets.WIN_LOCATION }}\eureka_service\logs</logpath>
                <log mode='roll'/>
              
                <onfailure action='restart' delay='10 sec'/>
                <onfailure action='restart' delay='30 sec'/>
                <onfailure action='restart' delay='60 sec'/>
              
                <startmode>Automatic</startmode>
            </service>
            '@; \$xml | Set-Content -Path '\$base\eureka-service.xml' -Encoding UTF8; Write-Host 'WinSW configuration created.'; Get-Content '\$base\eureka-service.xml'\""

      # ==========================
      # Stop existing service
      # ==========================
      - name: Stop Eureka Service
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "powershell -NoProfile -NonInteractive -Command \"\$service=Get-Service -Name 'Eureka-Service' -ErrorAction SilentlyContinue; if (\$service) { Write-Host ('Current status: ' + \$service.Status); if (\$service.Status -eq 'Running') { Stop-Service -Name 'Eureka-Service' -Force; \$service.WaitForStatus('Stopped',[TimeSpan]::FromSeconds(30)); Write-Host 'Eureka-Service stopped.' } } else { Write-Host 'Eureka-Service is not installed.' }\""

      # ==========================
      # Wait for Java process
      # ==========================
      - name: Wait for Eureka Java process
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "powershell -NoProfile -NonInteractive -Command \"\$timeout=30; do { \$java=Get-CimInstance Win32_Process | Where-Object { \$_.Name -eq 'java.exe' -and \$_.CommandLine -like '*eureka-service.jar*' }; if (-not \$java) { break }; Write-Host ('Waiting for Java PID(s): ' + (\$java.ProcessId -join ', ')); Start-Sleep -Seconds 1; \$timeout-- } while (\$timeout -gt 0); \$java=Get-CimInstance Win32_Process | Where-Object { \$_.Name -eq 'java.exe' -and \$_.CommandLine -like '*eureka-service.jar*' }; if (\$java) { throw ('Java process still running. PID(s): ' + (\$java.ProcessId -join ', ')) }; Write-Host 'Java process has stopped.'\""

      # ==========================
      # Backup existing JAR
      # ==========================
      - name: Backup existing JAR
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "powershell -NoProfile -NonInteractive -Command \"\$base='C:\${{ secrets.WIN_LOCATION }}\eureka_service'; \$jar='\$base\eureka-service.jar'; if (Test-Path \$jar) { \$timestamp=Get-Date -Format 'yyyyMMdd-HHmmss'; \$backup='\$base\eureka-service-\$timestamp.jar'; Copy-Item -Path \$jar -Destination \$backup -Force; Write-Host ('Backup created: ' + \$backup) } else { Write-Host 'No existing JAR. First deployment.' }\""

      # ==========================
      # Upload new JAR
      # ==========================
      - name: Upload new JAR
        shell: bash
        run: |
          scp \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            app.jar \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{ secrets.WIN_LOCATION }}/eureka_service/eureka-service.jar"

      # ==========================
      # Verify uploaded files
      # ==========================
      - name: Verify deployment files
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "powershell -NoProfile -NonInteractive -Command \"Get-ChildItem 'C:\${{ secrets.WIN_LOCATION }}\eureka_service'\""

      # ==========================
      # Install WinSW service if needed
      # ==========================
      - name: Install Eureka Service
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "powershell -NoProfile -NonInteractive -Command \"\$base='C:\${{ secrets.WIN_LOCATION }}\eureka_service'; \$wrapper='\$base\eureka-service.exe'; \$config='\$base\eureka-service.xml'; \$jar='\$base\eureka-service.jar'; if (!(Test-Path \$wrapper)) { throw ('WinSW wrapper missing: ' + \$wrapper) }; if (!(Test-Path \$config)) { throw ('WinSW config missing: ' + \$config) }; if (!(Test-Path \$jar)) { throw ('JAR missing: ' + \$jar) }; \$service=Get-Service -Name 'Eureka-Service' -ErrorAction SilentlyContinue; if (-not \$service) { Write-Host 'Installing Eureka-Service...'; & \$wrapper install; if (\$LASTEXITCODE -ne 0) { throw 'WinSW service installation failed.' } } else { Write-Host 'Eureka-Service already installed.' }\""

      # ==========================
      # Start Eureka Service
      # ==========================
      - name: Start Eureka Service
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "powershell -NoProfile -NonInteractive -Command \"Start-Service -Name 'Eureka-Service'; \$service=Get-Service -Name 'Eureka-Service'; \$service.WaitForStatus('Running',[TimeSpan]::FromSeconds(30)); Write-Host ('Eureka-Service status: ' + \$service.Status)\""

      # ==========================
      # Final verification
      # ==========================
      - name: Verify Eureka Deployment
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}" \
            "powershell -NoProfile -NonInteractive -Command \"Get-Service -Name 'Eureka-Service'; Write-Host ''; Write-Host 'Deployment files:'; Get-ChildItem 'C:\${{ secrets.WIN_LOCATION }}\eureka_service'; Write-Host ''; Write-Host 'Eureka Java process:'; Get-CimInstance Win32_Process | Where-Object { \$_.Name -eq 'java.exe' -and \$_.CommandLine -like '*eureka-service.jar*' } | Select-Object ProcessId,CommandLine\""


