name: Deploy Spring Boot to Server

on:
  push:
    branches:
      - staging
      - main
      - alfuttaim

jobs:
  deploy-linux:
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout code
        uses: actions/checkout@v4

      # =====================
      # Java Setup
      # =====================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # =====================
      # Build
      # =====================
      - name: Build with Maven
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests

      # =====================
      # Resolve JAR
      # =====================
      - name: Resolve JAR
        run: |
          JAR_FILE=$(find target -name "*.jar" ! -name "*original*.jar" | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No JAR found"
            exit 1
          fi

          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "Found: $JAR_FILE"

      # =====================================================
      # SSH SETUP (STAGING)
      # =====================================================
      - name: Setup SSH (Staging)
        if: github.ref == 'refs/heads/staging'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY STAGING
      # =====================================================
      - name: Deploy Staging
        if: github.ref == 'refs/heads/staging'
        run: |
          set -e
          
          SERVER="${{ secrets.STAGING_SERVER_USER }}@${{ secrets.STAGING_SERVER_HOST }}"
          REMOTE_DIR="/${{ secrets.LOCATION }}"
          REMOTE_PATH="$REMOTE_DIR/eureka-service.jar"
          
          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no "$SERVER" \
            "mkdir -p '$REMOTE_DIR'"

           echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Starting service..."
          ssh -o StrictHostKeyChecking=no "$SERVER" \
            "sudo systemctl start eureka"

          echo "Verifying service is running..."
          ssh -o StrictHostKeyChecking=no "$SERVER" \
            "sleep 5 && sudo systemctl is-active eureka"

          echo "Deployment complete"

      # =====================================================
      # SSH SETUP (PRODUCTION)
      # =====================================================
      - name: Setup SSH (Production)
        if: github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      # =====================================================
      # DEPLOY PRODUCTION
      # =====================================================
      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        run: |
          SERVER="${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}"
          REMOTE_PATH="/${{ secrets.LOCATION }}/eureka-service.jar"

          echo "Creating remote directory..."
          ssh -o StrictHostKeyChecking=no $SERVER "mkdir -p /opt/java-webservices"

          echo "Uploading JAR..."
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" \
            "$JAR_FILE" \
            $SERVER:$REMOTE_PATH

          echo "Deploying (safe SSH execution)..."
          ssh -o StrictHostKeyChecking=no $SERVER 'bash -s' << 'EOF'

            set -e

            echo "Stopping app safely..."

            PID=$(ps -ef | grep eureka-service.jar | grep -v grep | awk '{print $2}')

            if [ -n "$PID" ]; then
              echo "Killing PID: $PID"
              kill -9 $PID || true
            else
              echo "No running process found"
            fi

            echo "Starting app..."

            nohup java -Dspring.profiles.active=prod \
              -jar /${{ secrets.LOCATION }}/eureka-service.jar \
              >/dev/null 2>&1 < /dev/null &

            echo "Deployment complete"
          EOF
          


  deploy-alfuttaim:
    if: github.ref == 'refs/heads/alfuttaim'
    runs-on: ubuntu-latest

    env:
      APP_NAME: eureka-service
      DEPLOY_DIR: 'C:\${{ secrets.WIN_LOCATION }}\eureka_service'

    steps:
      # ==========================
      # Checkout source
      # ==========================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================
      # Setup Java
      # ==========================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # ==========================
      # Build
      # ==========================
      - name: Build Application
        run: mvn clean package -DskipTests

      # ==========================
      # Find executable JAR
      # ==========================
      - name: Locate JAR
        shell: bash
        run: |
          JAR=$(find . -type f -path "*/target/*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            | head -n 1)
          
          if [ -z "$JAR" ]; then
            echo "No executable JAR found."
            exit 1
          fi
          
          echo "Using JAR: $JAR"
          cp "$JAR" app.jar
#
      # ==========================
      # Configure SSH
      # ==========================
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.WINDOW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh-keyscan ${{ secrets.WINDOW_SERVER_HOST }} >> ~/.ssh/known_hosts

      # ==========================
      # Create deployment folder
      # ==========================
      - name: Create deployment directory
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -Command \"
              \$ErrorActionPreference='Stop'
      
              New-Item -ItemType Directory -Force -Path 'C:\${{ secrets.WIN_LOCATION }}\eureka_service' | Out-Null
      
              if (!(Test-Path 'C:\${{ secrets.WIN_LOCATION }}\eureka_service')) {
              throw 'Deployment directory was not created.'
            }
    
              Write-Host 'Deployment directory verified.'
            \""

      #######################################################
      # Stop service and backup current JAR
      #######################################################
      - name: Stop Service and Backup JAR
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
            $ErrorActionPreference='Stop'
  
            $jar = "C:\${{ secrets.WIN_LOCATION }}\eureka_service\eureka-service.jar"
                 
  
            Write-Host "========== BEFORE =========="
            Get-ChildItem C:\${{ secrets.WIN_LOCATION }}\eureka_service
  
            $service = Get-Service -Name "Eureka-Service" -ErrorAction Stop
  
            Write-Host "Current Status: $($service.Status)"
  
            if ($service.Status -eq "Running") {
              Write-Host 'Stopping service...'
              Stop-Service -Name "Eureka-Service" -Force
              $service.WaitForStatus("Stopped","00:00:30")
            }
          
            $service = Get-Service -Name "Eureka-Service"
          
            Write-Host "Service Status: $($service.Status)"
             
            $service = Get-Service "Eureka-Service"
            
            Write-Host "Waiting for java.exe to exit..."
            
            $timeout = 30
    
            do {
            
              $java = Get-CimInstance Win32_Process |
                Where-Object {
                  $_.Name -eq "java.exe" -and
                  $_.CommandLine -like "*eureka-service.jar*"
            }
        
            if (-not $java) {
              break
            }
          
            Write-Host "Waiting for PID(s): $($java.ProcessId -join ', ')"
            
            Start-Sleep -Seconds 1
            
            $timeout--
          
            } while ($timeout -gt 0)
              
              # Refresh one last time
              $java = Get-CimInstance Win32_Process |
                Where-Object {
                  $_.Name -eq "java.exe" -and
                  $_.CommandLine -like "*eureka-service.jar*"
            }
            
            if ($java) {
              throw "Java process still running. PID(s): $($java.ProcessId -join ', ')"
            }
  
            Write-Host "Status after stop: $($service.Status)"
  
            if ($service.Status -ne "Stopped") {
              Write-Host 'Service fail to stop...'
              throw "Service failed to stop."
            }
  
            Write-Host "Jar exists? $(Test-Path $jar)"
            
            Write-Host "Backing up JAR..."
    
            if (!(Test-Path $jar)) {
              throw ("Jar not found: " + $jar)
            }
          
            if (Test-Path $jar) {
                throw "Original JAR still exists."
            }
            
            Write-Host "========== AFTER =========="
            Get-ChildItem C:\${{ secrets.WIN_LOCATION }}\eureka_service
            Write-Host 'Backup completed.'
          EOF

      #######################################################
      # Upload new JAR
      #######################################################
      - name: Upload new JAR
        run: |
          scp -v -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            app.jar \
            "${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }}:/C:/${{ secrets.WIN_LOCATION }}/eureka_service/eureka-service.jar"

      #######################################################
      # Verify After Upload
      #######################################################
      - name: Verify after upload
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            powershell -Command "
              Get-ChildItem C:\${{ secrets.WIN_LOCATION }}\eureka_service
            "

      #######################################################
      # Start Windows service
      #######################################################
      - name: Start Service
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} \
            "powershell -NoProfile -NonInteractive -" <<'EOF'
          
            $ErrorActionPreference='Stop'
          
            if (!(Test-Path "C:\${{ secrets.WIN_LOCATION }}\eureka_service\eureka-service.jar")) {
                throw "Deployment JAR missing."
            }

            Write-Host 'Starting service...'
            Start-Service -Name 'Eureka-Service'
          
            Start-Sleep -Seconds 5
              
            $java = Get-CimInstance Win32_Process |
              Where-Object {
              $_.Name -eq "java.exe" -and
              $_.CommandLine -like "*eureka-service.jar*"
            }
              
            if (-not $java) {
              throw "Java process did not start."
            }

            Write-Host "Waiting for Running state..."
            (Get-Service -Name 'Eureka-Service').WaitForStatus('Running','00:00:30')

            $service = Get-Service -Name 'Eureka-Service'

            if ($service.Status -ne 'Running') {
                throw 'Service failed to start.'
            }

            Write-Host 'Service is running.'

            Write-Host 'Deployment completed successfully.'
          EOF

      #######################################################
      # Verify deployment
      #######################################################
      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            ${{ secrets.WINDOW_SERVER_USER }}@${{ secrets.WINDOW_SERVER_HOST }} powershell -Command "
            Get-Service -Name 'Eureka-Service'

            Write-Host ''
            Write-Host 'Current files:'

            Get-ChildItem C:\${{ secrets.WIN_LOCATION }}\eureka_service\*.jar
          "
