#
#          Write-Host "========== AFTER =========="
#          Get-ChildItem C:\java-webservices\eureka_service
#
#          Write-Host 'Removing previous backup...'
#
#          if (Test-Path "C:\java-webservices\eureka_service\eureka-service-old.jar") {
#              Remove-Item "C:\java-webservices\eureka_service\eureka-service-old.jar" -Force
